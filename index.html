<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초1 맞춤형 말하는 한글 돋보기</title>
    <style>
        /* 기본 화면 설정 */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            background-color: #f7f9fc;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            padding-top: 30px;
            padding-bottom: 250px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* 글자 크기 조절 버튼 영역 */
        #font-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            width: 85%;
            max-width: 900px;
            justify-content: center;
        }

        .font-btn {
            font-size: 20px;
            font-weight: bold;
            padding: 10px 20px;
            background-color: white;
            border: 2px solid #ddd;
            border-radius: 15px;
            cursor: pointer;
            color: #555;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .font-btn:hover {
            background-color: #f0f0f0;
            transform: scale(1.05);
            border-color: #bbb;
        }

        /* 글자 칸들이 정렬되는 영역 */
        #word-display {
            text-align: left;
            min-height: 200px;
            height: auto;
            width: 85%;
            max-width: 900px;
            word-break: keep-all;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-start;
            font-weight: bold;
        }

        /* 정사각형 글자 한 칸 스타일 */
        #word-display .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #ff9999;
            background-color: white;
            border-radius: 10px;
            aspect-ratio: 1 / 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        /* 띄어쓰기 칸 스타일 */
        #word-display .cell.space {
            background-color: #e2e8f0;
            border: 3px dashed #cbd5e1;
        }

        /* 문장 부호 칸 스타일 */
        #word-display .cell.punctuation {
            border: 3px solid #a8d5e2;
            background-color: #f0fdf4;
            color: #059669;
        }

        /* 💡 수정 1: 온점(.) 격자 칸 내부에서 왼쪽 하단으로 배치 */
        #word-display .cell.dot-cell {
            align-items: flex-end;    /* 아래쪽 정렬 */
            justify-content: flex-start; /* 왼쪽 정렬 */
            /* 온점이 칸 구석에 너무 붙지 않도록 약간의 여백(패딩) 주기 */
            padding-left: 15%;
            padding-bottom: 15%;
        }

        /* 하단 고정 마이크 영역 */
        #bottom-area {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, #f7f9fc 70%, transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
            padding-top: 50px;
            z-index: 100;
        }

        /* 마이크 이미지 버튼 */
        #image-mic-btn {
            border: none;
            background-color: transparent;
            cursor: pointer;
            transition: transform 0.2s;
            width: auto;
            max-width: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #image-mic-btn img {
            width: 100%;
            height: auto;
            display: block;
        }

        #image-mic-btn:hover {
            transform: scale(1.05);
        }

        /* 듣는 중 애니메이션 */
        #image-mic-btn.listening {
            animation: blink-mic 1.2s infinite;
        }

        #status {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #666;
            height: 30px;
        }

        @keyframes blink-mic {
            0% { opacity: 1; transform: scale(1.05); }
            50% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* 반응형 디자인 미디어 쿼리 */
        @media screen and (min-width: 1024px) {
            body { padding-top: 50px; padding-bottom: 280px; }
            #font-controls { width: 90%; gap: 20px; }
            .font-btn { font-size: 22px; padding: 12px 25px; }
            #word-display { width: 90%; min-height: 300px; gap: 15px; }
            #image-mic-btn { max-width: 180px; }
            #status { font-size: 24px; margin-top: 25px; }
        }
    </style>
</head>
<body>

    <div id="font-controls">
        <button class="font-btn" id="font-down">🔍 ➖ 작게</button>
        <button class="font-btn" id="font-up">🔍 ➕ 크게</button>
    </div>

    <div id="word-display"></div>
    
    <div id="bottom-area">
        <div style="position: relative;"> 
            <button id="image-mic-btn">
                <img src="image_1.png" alt="마이크">
            </button>
        </div>
        <div id="status">준비 완료!</div>
    </div>

    <script>
        let currentFontSize = 80;
        const wordDisplay = document.getElementById('word-display');
        const btnUp = document.getElementById('font-up');
        const btnDown = document.getElementById('font-down');
        let rawRecognizedText = ""; // 💡 억양 판별을 위해 브라우저 원본 텍스트를 저장할 변수

        // 정사각형 칸을 예쁘게 그려주는 함수
        function renderCells(text) {
            wordDisplay.innerHTML = '';
            
            if (text === "...") {
                wordDisplay.textContent = "...";
                wordDisplay.style.fontSize = currentFontSize + 'px';
                wordDisplay.style.color = "#aaa";
                return;
            }

            const cellSize = currentFontSize + 24;
            
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const cell = document.createElement('span');
                cell.classList.add('cell');
                
                if (char === ' ') {
                    cell.classList.add('space');
                } else if (['.', '?', '!'].includes(char)) {
                    cell.classList.add('punctuation');
                    // 💡 수정 1: 온점(.)인 경우 특수 클래스를 붙여 왼쪽 아래로 정렬시킴
                    if (char === '.') {
                        cell.classList.add('dot-cell');
                    }
                }
                
                cell.textContent = char;
                cell.style.width = `${cellSize}px`;
                cell.style.height = `${cellSize}px`;
                cell.style.fontSize = `${currentFontSize}px`;
                wordDisplay.appendChild(cell);
            }
        }

        // 💡 수정 2: 인토네이션(억양)과 어미에 따른 문장 부호 판별 로직 고도화
        function applyPunctuation(text, originalText) {
            text = text.trim();
            if (!text || text === "...") return text;
            
            // 이미 부호가 끝에 붙어 있다면 브라우저가 판별한 결과를 우선 신뢰함
            let lastChar = text.slice(-1);
            if (['.', '?', '!'].includes(lastChar)) {
                // 단, 브라우저가 아무것도 안 붙여줬을 때만 아래 커스텀 룰을 통과함
                return text; 
            }

            // 브라우저의 원본 텍스트 데이터에서 종결 기호가 있었는지 확인 (억양 추적)
            const origLast = originalText.trim().slice(-1);

            // 1. 요로 끝날 때 인토네이션 추적
            if (lastChar === '요') {
                if (origLast === '?') {
                    return text + '?'; // 끝을 올렸을 때
                } else {
                    return text + '.'; // 평서문으로 내렸을 때
                }
            }

            // 2. 일반적인 물음표(?) 규칙 (의문형 단어 및 어미)
            const isQuestion = text.match(/(누가|언제|어디|무엇|뭐|어떻게|왜|몇|있니|했니|했나요|인가요|맞나요|가요)/) || ['까', '니', '냐'].includes(lastChar) || origLast === '?';
            
            // 3. 느낌표(!) 규칙 (감탄사 및 강한 어조)
            const isExclamation = text.match(/(우와|와|앗|아싸|야호|헉|짜잔|최고|정말|진짜)/) || origLast === '!';

            if (isQuestion) return text + '?';
            if (isExclamation) return text + '!';
            return text + '.'; // 기본 온점
        }

        // 크기 조절 버튼 이벤트
        btnUp.addEventListener('click', () => {
            if (currentFontSize < 150) {
                currentFontSize += 10;
                const currentText = Array.from(wordDisplay.querySelectorAll('.cell')).map(c => c.textContent).join('');
                if(currentText) renderCells(currentText);
            }
        });

        btnDown.addEventListener('click', () => {
            if (currentFontSize > 30) {
                currentFontSize -= 10;
                const currentText = Array.from(wordDisplay.querySelectorAll('.cell')).map(c => c.textContent).join('');
                if(currentText) renderCells(currentText);
            }
        });

        // 초기화
        renderCells("");

        // ---------------- 음성 인식(STT) 로직 ----------------
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            wordDisplay.innerHTML = "크롬 브라우저를 사용해주세요!";
            document.getElementById('image-mic-btn').style.display = 'none';
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR'; 
            recognition.interimResults = true; 
            recognition.maxAlternatives = 1;

            const micBtn = document.getElementById('image-mic-btn');
            const statusDisplay = document.getElementById('status');

            let isListening = false;
            let isComplete = false;

            micBtn.addEventListener('click', () => {
                if (isListening) { recognition.stop(); return; }
                if (isComplete) { resetApp(); recognition.start(); return; }
                recognition.start();
            });

            function resetApp() {
                isListening = false;
                isComplete = false;
                rawRecognizedText = "";
                renderCells("...");
                statusDisplay.textContent = "귀를 쫑긋 세우고 있어요!";
            }

            recognition.onstart = function() {
                isListening = true;
                micBtn.classList.add('listening');
                statusDisplay.textContent = "듣고 있어요!";
                renderCells("...");
            }

            recognition.onresult = function(event) {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                
                // 브라우저가 원본으로 인식한 텍스트 기호까지 임시 저장 (인토네이션 힌트 획득용)
                rawRecognizedText = finalTranscript || interimTranscript;
                
                // 실시간 입력 중에는 가공되지 않은 텍스트를 보여줌
                renderCells(rawRecognizedText);
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            };

            recognition.onerror = function(event) {
                statusDisplay.textContent = "앗, 잘 못 들었어요. 다시 해볼까요?";
            };

            // 마이크 종료 시점에 부호 최종 가공 및 삽입
            recognition.onend = function() {
                isListening = false;
                micBtn.classList.remove('listening');

                const cells = wordDisplay.querySelectorAll('.cell');
                let currentText = Array.from(cells).map(cell => cell.textContent).join('').trim();

                // 기존에 잘못 붙었을 수 있는 문장부호 임시 제거 후 재계산
                if (['.', '?', '!'].includes(currentText.slice(-1))) {
                    currentText = currentText.slice(0, -1);
                }

                if (currentText && currentText !== "...") {
                    isComplete = true;
                    statusDisplay.textContent = "완료!"; 
                    
                    // 💡 수정 2: 수집된 텍스트와 원본 인식 텍스트(인토네이션 포함)를 비교하여 최종 부호 결정
                    let finalText = applyPunctuation(currentText, rawRecognizedText);
                    renderCells(finalText);
                } else {
                    statusDisplay.textContent = "다시 말하기 버튼을 눌러주세요.";
                }
            };
        }
    </script>
</body>
</html>
