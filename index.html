<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초1 맞춤형 말하는 한글 돋보기</title>
    <style>
        /* 기본 화면 설정 */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh; /* 💡 수정 2: 내용이 길어지면 화면이 아래로 늘어나도록 변경 */
            margin: 0;
            background-color: #f7f9fc;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            padding-top: 30px;
            padding-bottom: 250px; /* 맨 아래 고정된 마이크 버튼에 가려지지 않도록 여유 공간 확보 */
            box-sizing: border-box;
        }

        #top-visuals {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-bottom: 20px;
            font-size: 50px;
            font-weight: bold;
            color: #ccc;
        }

        #top-visuals .item { display: flex; align-items: center; justify-content: center; }
        #top-visuals .active { color: #ff9999; }
        #top-visuals .arrow { font-size: 30px; color: #ddd; }
        #top-visuals #visual-hangul { color: #a8d5e2; font-weight: 900; }

        /* 💡 수정 3: 글자 크기 조절 버튼 영역 */
        #font-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .font-btn {
            font-size: 20px;
            font-weight: bold;
            padding: 10px 20px;
            background-color: white;
            border: 2px solid #ddd;
            border-radius: 15px;
            cursor: pointer;
            color: #555;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .font-btn:hover {
            background-color: #f0f0f0;
            transform: scale(1.05);
            border-color: #bbb;
        }

        /* 💡 수정 1 & 2: 원고지 스타일의 텍스트 박스 */
        #word-display {
            text-align: left; /* 가운데 정렬을 왼쪽 정렬로 변경 */
            min-height: 300px; /* 기본 높이 */
            height: auto; /* 글이 길어지면 자동으로 늘어남 */
            width: 85%;
            max-width: 900px;
            word-break: keep-all;
            padding: 40px;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            
            /* 원고지 특유의 테두리 디자인 */
            border: 4px solid #e53935; /* 붉은색 테두리 */
            color: #333;
            font-weight: bold;
        }

        /* 💡 수정 2: 마이크 버튼이 다른 글자와 겹치지 않도록 화면 맨 아래에 항상 띄워둠 */
        #bottom-area {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, #f7f9fc 70%, transparent); /* 텍스트 위로 자연스럽게 올라오는 효과 */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
            padding-top: 50px;
            z-index: 100; /* 항상 가장 위에 보이도록 설정 */
        }

        #mic-btn {
            font-size: 60px;
            width: 130px;
            height: 130px;
            background-color: #ff9999;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(255, 153, 153, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: all 0.3s ease;
            position: relative;
        }

        #mic-btn:hover { transform: scale(1.05); box-shadow: 0 10px 22px rgba(255, 153, 153, 0.4); }
        #mic-btn.listening { background-color: #ffcc00; box-shadow: 0 8px 18px rgba(255, 204, 0, 0.3); animation: blink 1.2s infinite; }
        #mic-btn.complete { background-color: #4cd137; box-shadow: 0 8px 18px rgba(76, 209, 55, 0.3); cursor: default; }

        #retry-btn {
            display: none;
            font-size: 30px;
            background-color: #ddd;
            color: #666;
            border: none;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            cursor: pointer;
            position: absolute;
            bottom: -80px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #retry-btn:hover { background-color: #ccc; transform: scale(1.1); }
        #mic-btn.retry-ready #retry-btn { display: flex; align-items: center; justify-content: center; }

        #status {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #666;
            height: 30px;
        }

        @keyframes blink {
            0% { opacity: 1; transform: scale(1.05); }
            50% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div id="top-visuals">
        <div id="visual-speak" class="item active">👄🎤</div>
        <div class="arrow item">➡️</div>
        <div id="visual-hangul" class="item">ㄱㄴㄷ</div>
    </div>

    <div id="font-controls">
        <button class="font-btn" id="font-down">🔍 ➖ 작게</button>
        <button class="font-btn" id="font-up">🔍 ➕ 크게</button>
    </div>

    <div id="word-display"></div>
    
    <div id="bottom-area">
        <div style="position: relative;"> 
            <button id="mic-btn">🎤
                <span id="retry-btn">🔄</span> 
            </button>
        </div>
        <div id="status">준비 완료!</div>
    </div>

    <script>
        // 💡 수정 1 & 3: 글자 크기와 원고지 격자무늬를 동기화하는 자바스크립트
        let currentFontSize = 80; // 초기 글자 크기
        const wordDisplay = document.getElementById('word-display');
        const btnUp = document.getElementById('font-up');
        const btnDown = document.getElementById('font-down');

        function updateGridAndFont() {
            // 글자 크기 적용
            wordDisplay.style.fontSize = currentFontSize + 'px';
            
            // 폰트 크기에 비례하여 원고지(깍두기) 격자 크기 조절
            // 줄 간격을 맞추기 위해 폰트 크기의 1.5배로 격자 크기를 설정합니다.
            const gridSize = currentFontSize * 1.5; 
            wordDisplay.style.lineHeight = gridSize + 'px';
            
            // 원고지 격자무늬(배경) 그리기
            wordDisplay.style.backgroundImage = `
                linear-gradient(to right, #ffcdd2 2px, transparent 2px),
                linear-gradient(to bottom, #ffcdd2 2px, transparent 2px)
            `;
            wordDisplay.style.backgroundSize = `${gridSize}px ${gridSize}px`;
            
            // 글씨가 테두리에 너무 붙지 않게 패딩도 비례해서 조정
            wordDisplay.style.padding = `${gridSize * 0.5}px ${gridSize * 0.8}px`;
        }

        // 폰트 크기 키우기 버튼 클릭
        btnUp.addEventListener('click', () => {
            if (currentFontSize < 150) { // 너무 커지지 않게 제한
                currentFontSize += 10;
                updateGridAndFont();
            }
        });

        // 폰트 크기 줄이기 버튼 클릭
        btnDown.addEventListener('click', () => {
            if (currentFontSize > 30) { // 너무 작아지지 않게 제한
                currentFontSize -= 10;
                updateGridAndFont();
            }
        });

        // 페이지 시작 시 한 번 실행하여 초기 디자인 적용
        updateGridAndFont();

        // ---------------- 기존 음성 인식(STT) 코드 ----------------
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            wordDisplay.innerHTML = "크롬 브라우저를<br>사용해주세요!";
            document.getElementById('mic-btn').style.display = 'none';
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR'; 
            recognition.interimResults = true; 
            recognition.maxAlternatives = 1;

            const micBtn = document.getElementById('mic-btn');
            const retryBtn = document.getElementById('retry-btn');
            const statusDisplay = document.getElementById('status');
            const visualSpeak = document.getElementById('visual-speak');
            const visualHangul = document.getElementById('visual-hangul');

            let isListening = false;
            let isComplete = false;

            micBtn.addEventListener('click', () => {
                if (isListening) { recognition.stop(); return; }
                if (isComplete) { resetApp(); recognition.start(); return; }
                recognition.start();
            });

            retryBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                resetApp();
                recognition.start();
            });

            function resetApp() {
                isListening = false;
                isComplete = false;
                micBtn.classList.remove('complete', 'retry-ready');
                wordDisplay.textContent = "...";
                statusDisplay.textContent = "귀를 쫑긋 세우고 있어요!";
                visualSpeak.classList.add('active');
                visualHangul.classList.remove('active');
            }

            recognition.onstart = function() {
                isListening = true;
                micBtn.classList.add('listening');
                statusDisplay.textContent = "듣고 있어요!";
                wordDisplay.textContent = "...";
                visualSpeak.classList.add('active');
                visualHangul.classList.remove('active');
            }

            recognition.onresult = function(event) {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }
                wordDisplay.innerHTML = finalTranscript || interimTranscript;
                
                // 말이 길어질 때 최하단으로 자연스럽게 스크롤 되도록 설정
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            };

            recognition.onerror = function(event) {
                statusDisplay.textContent = "앗, 잘 못 들었어요. 다시 해볼까요?";
            };

            recognition.onend = function() {
                isListening = false;
                micBtn.classList.remove('listening');

                if (!wordDisplay.textContent.includes("...") && wordDisplay.textContent.trim() !== "") {
                    isComplete = true;
                    micBtn.classList.add('complete');
                    statusDisplay.textContent = "멋진 낱말을 적었어요! 완료!";
                    visualSpeak.classList.remove('active');
                    visualHangul.classList.add('active');

                    setTimeout(() => {
                        if(isComplete) {
                            micBtn.classList.add('retry-ready');
                            statusDisplay.textContent = "버튼을 누르면 다시 할 수 있어요!";
                        }
                    }, 2500);
                } else {
                    micBtn.classList.remove('complete');
                    statusDisplay.textContent = "다시 말하기 버튼을 눌러주세요.";
                    visualSpeak.classList.remove('active');
                    visualHangul.classList.remove('active');
                }
            };
        }
    </script>
</body>
</html>
